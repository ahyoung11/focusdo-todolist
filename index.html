<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FocusDo - 스마트 할 일 관리 (To Do List)</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: {
              50: '#eff6ff',
              100: '#dbeafe',
              500: '#3b82f6',
              600: '#2563eb',
              700: '#1d4ed8',
            }
          }
        }
      }
    }
  </script>
  <!-- React & Babel CDN -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <!-- Supabase JS Client CDN -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    /* Custom scrollbars */
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 9999px; }
    .dark ::-webkit-scrollbar-thumb { background: #475569; }
    ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
    .dark ::-webkit-scrollbar-thumb:hover { background: #64748b; }
  </style>
</head>
<body class="bg-slate-50 dark:bg-slate-950 text-slate-900 dark:text-slate-100 min-h-screen transition-colors duration-200">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useMemo, useRef } = React;

    // --- 아이콘 컴포넌트 ---
    const Icons = {
      Check: ({ className = "w-5 h-5" }) => (
        <svg className={className} fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth={2}>
          <path strokeLinecap="round" strokeLinejoin="round" d="M5 13l4 4L19 7" />
        </svg>
      ),
      Plus: ({ className = "w-5 h-5" }) => (
        <svg className={className} fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth={2}>
          <path strokeLinecap="round" strokeLinejoin="round" d="M12 4v16m8-8H4" />
        </svg>
      ),
      Trash: ({ className = "w-5 h-5" }) => (
        <svg className={className} fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth={2}>
          <path strokeLinecap="round" strokeLinejoin="round" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" />
        </svg>
      ),
      Star: ({ filled = false, className = "w-5 h-5" }) => (
        <svg className={`${className} ${filled ? "fill-amber-400 text-amber-400" : "fill-none text-slate-400 hover:text-amber-400"}`} viewBox="0 0 24 24" stroke="currentColor" strokeWidth={2}>
          <path strokeLinecap="round" strokeLinejoin="round" d="M11.049 2.927c.3-.921 1.603-.921 1.902 0l1.519 4.674a1 1 0 00.95.69h4.915c.969 0 1.371 1.24.588 1.81l-3.976 2.888a1 1 0 00-.363 1.118l1.518 4.674c.3.922-.755 1.688-1.538 1.118l-3.976-2.888a1 1 0 00-1.176 0l-3.976 2.888c-.783.57-1.838-.197-1.538-1.118l1.518-4.674a1 1 0 00-.363-1.118l-3.976-2.888c-.784-.57-.38-1.81.588-1.81h4.914a1 1 0 00.951-.69l1.519-4.674z" />
        </svg>
      ),
      Calendar: ({ className = "w-4 h-4" }) => (
        <svg className={className} fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth={2}>
          <path strokeLinecap="round" strokeLinejoin="round" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z" />
        </svg>
      ),
      Sun: ({ className = "w-5 h-5" }) => (
        <svg className={className} fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth={2}>
          <path strokeLinecap="round" strokeLinejoin="round" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z" />
        </svg>
      ),
      Moon: ({ className = "w-5 h-5" }) => (
        <svg className={className} fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth={2}>
          <path strokeLinecap="round" strokeLinejoin="round" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z" />
        </svg>
      ),
      Settings: ({ className = "w-5 h-5" }) => (
        <svg className={className} fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth={2}>
          <path strokeLinecap="round" strokeLinejoin="round" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z" />
          <path strokeLinecap="round" strokeLinejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
        </svg>
      ),
      Search: ({ className = "w-5 h-5" }) => (
        <svg className={className} fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth={2}>
          <path strokeLinecap="round" strokeLinejoin="round" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />
        </svg>
      ),
      X: ({ className = "w-5 h-5" }) => (
        <svg className={className} fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth={2}>
          <path strokeLinecap="round" strokeLinejoin="round" d="M6 18L18 6M6 6l12 12" />
        </svg>
      ),
      Folder: ({ className = "w-4 h-4" }) => (
        <svg className={className} fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth={2}>
          <path strokeLinecap="round" strokeLinejoin="round" d="M3 7v10a2 2 0 002 2h14a2 2 0 002-2V9a2 2 0 00-2-2h-6l-2-2H5a2 2 0 00-2 2z" />
        </svg>
      ),
      Clock: ({ className = "w-4 h-4" }) => (
        <svg className={className} fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth={2}>
          <path strokeLinecap="round" strokeLinejoin="round" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z" />
        </svg>
      ),
      Download: ({ className = "w-5 h-5" }) => (
        <svg className={className} fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth={2}>
          <path strokeLinecap="round" strokeLinejoin="round" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4" />
        </svg>
      ),
      Upload: ({ className = "w-5 h-5" }) => (
        <svg className={className} fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth={2}>
          <path strokeLinecap="round" strokeLinejoin="round" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l-4-4m0 0L8 8m4-4v12" />
        </svg>
      ),
      Menu: ({ className = "w-6 h-6" }) => (
        <svg className={className} fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth={2}>
          <path strokeLinecap="round" strokeLinejoin="round" d="M4 6h16M4 12h16M4 18h16" />
        </svg>
      ),
      Database: ({ className = "w-4 h-4" }) => (
        <svg className={className} fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth={2}>
          <ellipse cx="12" cy="5" rx="9" ry="3" />
          <path d="M21 12c0 1.66-4 3-9 3s-9-1.34-9-3" />
          <path d="M3 5v14c0 1.66 4 3 9 3s9-1.34 9-3V5" />
        </svg>
      )
    };

    const DEFAULT_CATEGORIES = [
      { id: 'work', name: '업무', color: '#3b82f6' },
      { id: 'personal', name: '개인', color: '#10b981' },
      { id: 'study', name: '공부', color: '#8b5cf6' },
      { id: 'shopping', name: '쇼핑', color: '#f59e0b' },
    ];

    const getTodayStr = () => new Date().toISOString().split('T')[0];

    const DEFAULT_TASKS = [
      {
        id: '1',
        title: 'FocusDo 기능 살펴보기 (PRD 반영 확인)',
        description: 'PRD에 정의된 4개 화면과 핵심 기능들이 어떻게 구성되었는지 확인해 보세요.',
        completed: true,
        dueDate: getTodayStr(),
        priority: 'high',
        starred: true,
        categoryId: 'work',
        subTasks: [
          { id: 's1', title: '메인 대시보드 둘러보기', completed: true },
          { id: 's2', title: '상세 드로어 열어보기', completed: true },
        ],
        createdAt: new Date().toISOString()
      },
      {
        id: '2',
        title: '오늘 꼭 끝내야 하는 중요 태스크 추가해보기',
        description: '상단의 빠른 추가 입력창에서 제목과 마감일을 선택하고 Enter를 눌러보세요.',
        completed: false,
        dueDate: getTodayStr(),
        priority: 'high',
        starred: true,
        categoryId: 'work',
        subTasks: [
          { id: 's3', title: '우선순위를 높음(High)으로 설정하기', completed: false }
        ],
        createdAt: new Date().toISOString()
      },
      {
        id: '3',
        title: '우측 상단 톱니바퀴에서 다크 모드 켜보기',
        description: '다크 모드로 눈의 피로를 덜고 심플한 디자인을 즐겨보세요.',
        completed: false,
        dueDate: '',
        priority: 'medium',
        starred: false,
        categoryId: 'personal',
        subTasks: [],
        createdAt: new Date().toISOString()
      }
    ];

    function App() {
      // Supabase 설정 상태
      const [supabaseUrl, setSupabaseUrl] = useState(() => localStorage.getItem('focusdo_sb_url') || '');
      const [supabaseKey, setSupabaseKey] = useState(() => localStorage.getItem('focusdo_sb_key') || '');
      const [isDbConnected, setIsDbConnected] = useState(false);
      const [dbSyncing, setDbSyncing] = useState(false);

      // Supabase 클라이언트 인스턴스
      const supabaseRef = useRef(null);

      const [tasks, setTasks] = useState(() => {
        try {
          const saved = localStorage.getItem('focusdo_tasks');
          return saved ? JSON.parse(saved) : DEFAULT_TASKS;
        } catch {
          return DEFAULT_TASKS;
        }
      });

      const [categories, setCategories] = useState(() => {
        try {
          const saved = localStorage.getItem('focusdo_categories');
          return saved ? JSON.parse(saved) : DEFAULT_CATEGORIES;
        } catch {
          return DEFAULT_CATEGORIES;
        }
      });

      const [darkMode, setDarkMode] = useState(() => localStorage.getItem('focusdo_dark') === 'true');

      const [currentFilter, setCurrentFilter] = useState('today');
      const [selectedTaskId, setSelectedTaskId] = useState(null);
      const [showCategoryModal, setShowCategoryModal] = useState(false);
      const [showSettingsModal, setShowSettingsModal] = useState(false);
      const [searchQuery, setSearchQuery] = useState('');
      const [sortBy, setSortBy] = useState('created');
      const [isMobileSidebarOpen, setIsMobileSidebarOpen] = useState(false);

      const [newTitle, setNewTitle] = useState('');
      const [newDueDate, setNewDueDate] = useState('');
      const [newPriority, setNewPriority] = useState('medium');
      const [newCategory, setNewCategory] = useState('work');

      // Supabase 클라이언트 초기화 및 데이터 로드
      useEffect(() => {
        if (supabaseUrl && supabaseKey && window.supabase) {
          try {
            const client = window.supabase.createClient(supabaseUrl.trim(), supabaseKey.trim());
            supabaseRef.current = client;
            fetchFromSupabase(client);
          } catch (e) {
            console.error("Supabase init error:", e);
            setIsDbConnected(false);
          }
        } else {
          supabaseRef.current = null;
          setIsDbConnected(false);
        }
      }, [supabaseUrl, supabaseKey]);

      const fetchFromSupabase = async (client) => {
        setDbSyncing(true);
        try {
          const { data: catData, error: catErr } = await client.from('categories').select('*');
          if (!catErr && catData && catData.length > 0) {
            setCategories(catData);
          }

          const { data: taskData, error: taskErr } = await client.from('tasks').select('*').order('created_at', { ascending: false });
          if (!taskErr && taskData) {
            const mapped = taskData.map(t => ({
              id: t.id,
              title: t.title,
              description: t.description || '',
              completed: t.completed || false,
              dueDate: t.due_date || '',
              priority: t.priority || 'medium',
              starred: t.starred || false,
              categoryId: t.category_id || 'work',
              subTasks: t.sub_tasks || [],
              createdAt: t.created_at || new Date().toISOString(),
              updatedAt: t.updated_at
            }));
            setTasks(mapped);
            setIsDbConnected(true);
          }
        } catch (err) {
          console.error("Supabase fetch error:", err);
          setIsDbConnected(false);
        } finally {
          setDbSyncing(false);
        }
      };

      // 로컬스토리지 백업 이펙트
      useEffect(() => {
        localStorage.setItem('focusdo_tasks', JSON.stringify(tasks));
      }, [tasks]);

      useEffect(() => {
        localStorage.setItem('focusdo_categories', JSON.stringify(categories));
      }, [categories]);

      useEffect(() => {
        localStorage.setItem('focusdo_dark', darkMode);
        if (darkMode) {
          document.documentElement.classList.add('dark');
        } else {
          document.documentElement.classList.remove('dark');
        }
      }, [darkMode]);

      // --- 핸들러 함수들 ---
      const handleAddTask = async (e) => {
        if (e) e.preventDefault();
        if (!newTitle.trim()) return;

        const newTask = {
          id: Date.now().toString(),
          title: newTitle.trim(),
          description: '',
          completed: false,
          dueDate: newDueDate || (currentFilter === 'today' ? getTodayStr() : ''),
          priority: newPriority,
          starred: currentFilter === 'important',
          categoryId: categories.some(c => c.id === currentFilter) ? currentFilter : newCategory,
          subTasks: [],
          createdAt: new Date().toISOString()
        };

        setTasks([newTask, ...tasks]);
        setNewTitle('');
        setNewDueDate('');

        // Supabase DB 저장
        if (supabaseRef.current && isDbConnected) {
          try {
            await supabaseRef.current.from('tasks').insert([{
              id: newTask.id,
              title: newTask.title,
              description: newTask.description,
              completed: newTask.completed,
              due_date: newTask.dueDate,
              priority: newTask.priority,
              starred: newTask.starred,
              category_id: newTask.categoryId,
              sub_tasks: newTask.subTasks,
              created_at: newTask.createdAt
            }]);
          } catch (err) {
            console.error("DB insert error:", err);
          }
        }
      };

      const handleToggleComplete = async (id) => {
        const target = tasks.find(t => t.id === id);
        if (!target) return;
        const newStatus = !target.completed;
        const nowIso = new Date().toISOString();

        setTasks(tasks.map(t => t.id === id ? { ...t, completed: newStatus, updatedAt: nowIso } : t));

        if (supabaseRef.current && isDbConnected) {
          await supabaseRef.current.from('tasks').update({ completed: newStatus, updated_at: nowIso }).eq('id', id);
        }
      };

      const handleToggleStar = async (id) => {
        const target = tasks.find(t => t.id === id);
        if (!target) return;
        const newStar = !target.starred;

        setTasks(tasks.map(t => t.id === id ? { ...t, starred: newStar } : t));

        if (supabaseRef.current && isDbConnected) {
          await supabaseRef.current.from('tasks').update({ starred: newStar }).eq('id', id);
        }
      };

      const handleDeleteTask = async (id) => {
        setTasks(tasks.filter(t => t.id !== id));
        if (selectedTaskId === id) setSelectedTaskId(null);

        if (supabaseRef.current && isDbConnected) {
          await supabaseRef.current.from('tasks').delete().eq('id', id);
        }
      };

      const handleUpdateTask = async (updated) => {
        const nowIso = new Date().toISOString();
        const fullUpdated = { ...updated, updatedAt: nowIso };
        setTasks(tasks.map(t => t.id === updated.id ? fullUpdated : t));

        if (supabaseRef.current && isDbConnected) {
          await supabaseRef.current.from('tasks').update({
            title: fullUpdated.title,
            description: fullUpdated.description,
            completed: fullUpdated.completed,
            due_date: fullUpdated.dueDate,
            priority: fullUpdated.priority,
            starred: fullUpdated.starred,
            category_id: fullUpdated.categoryId,
            sub_tasks: fullUpdated.subTasks,
            updated_at: nowIso
          }).eq('id', updated.id);
        }
      };

      const handleClearCompleted = async () => {
        if (confirm('완료된 모든 할 일을 목록에서 삭제하시겠습니까?')) {
          setTasks(tasks.filter(t => !t.completed));
          if (supabaseRef.current && isDbConnected) {
            await supabaseRef.current.from('tasks').delete().eq('completed', true);
          }
        }
      };

      // --- 통계 및 필터링 ---
      const todayStr = getTodayStr();

      const counts = useMemo(() => {
        const todayCount = tasks.filter(t => !t.completed && t.dueDate === todayStr).length;
        const importantCount = tasks.filter(t => !t.completed && t.starred).length;
        const upcomingCount = tasks.filter(t => !t.completed && t.dueDate && t.dueDate > todayStr).length;
        const allCount = tasks.filter(t => !t.completed).length;
        const completedCount = tasks.filter(t => t.completed).length;
        return { todayCount, importantCount, upcomingCount, allCount, completedCount };
      }, [tasks, todayStr]);

      const filteredTasks = useMemo(() => {
        let result = tasks.filter(task => {
          if (searchQuery.trim() && !task.title.toLowerCase().includes(searchQuery.toLowerCase())) {
            return false;
          }
          if (currentFilter === 'today') return task.dueDate === todayStr || (!task.completed && !task.dueDate);
          if (currentFilter === 'important') return task.starred;
          if (currentFilter === 'upcoming') return task.dueDate && task.dueDate > todayStr;
          if (currentFilter === 'all') return true;
          if (currentFilter === 'completed') return task.completed;
          return task.categoryId === currentFilter;
        });

        return result.sort((a, b) => {
          if (a.completed !== b.completed) return a.completed ? 1 : -1;
          if (sortBy === 'priority') {
            const pMap = { high: 1, medium: 2, low: 3 };
            return pMap[a.priority] - pMap[b.priority];
          }
          if (sortBy === 'due') {
            if (!a.dueDate) return 1;
            if (!b.dueDate) return -1;
            return a.dueDate.localeCompare(b.dueDate);
          }
          return new Date(b.createdAt).getTime() - new Date(a.createdAt).getTime();
        });
      }, [tasks, currentFilter, searchQuery, sortBy, todayStr]);

      const selectedTask = tasks.find(t => t.id === selectedTaskId);
      const completionRate = tasks.length > 0 ? Math.round((tasks.filter(t => t.completed).length / tasks.length) * 100) : 0;

      return (
        <div className="flex h-screen overflow-hidden">
          {isMobileSidebarOpen && (
            <div className="fixed inset-0 bg-black/40 z-30 md:hidden" onClick={() => setIsMobileSidebarOpen(false)} />
          )}

          {/* [화면 1] 사이드바 */}
          <aside className={`fixed md:static inset-y-0 left-0 z-40 w-64 bg-white dark:bg-slate-900 border-r border-slate-200 dark:border-slate-800 flex flex-col transform transition-transform duration-200 ease-in-out ${isMobileSidebarOpen ? 'translate-x-0' : '-translate-x-full md:translate-x-0'}`}>
            <div className="p-4 border-b border-slate-200 dark:border-slate-800 flex items-center justify-between">
              <div className="flex items-center space-x-2.5">
                <div className="w-8 h-8 rounded-lg bg-blue-600 flex items-center justify-center text-white font-bold shadow-md shadow-blue-500/30">
                  <Icons.Check className="w-5 h-5 stroke-[2.5]" />
                </div>
                <div>
                  <h1 className="font-bold text-lg tracking-tight text-slate-800 dark:text-white leading-tight">FocusDo</h1>
                  <div className="flex items-center space-x-1">
                    <span className={`w-1.5 h-1.5 rounded-full ${isDbConnected ? 'bg-emerald-500' : 'bg-slate-400'}`} />
                    <p className="text-[10px] text-slate-500 font-medium">
                      {isDbConnected ? 'Supabase 연동됨' : '로컬 스토리지'}
                    </p>
                  </div>
                </div>
              </div>
              <button onClick={() => setDarkMode(!darkMode)} className="p-2 rounded-lg text-slate-500 hover:bg-slate-100 dark:hover:bg-slate-800 transition-colors">
                {darkMode ? <Icons.Sun className="w-4 h-4 text-amber-400" /> : <Icons.Moon className="w-4 h-4 text-slate-600" />}
              </button>
            </div>

            <nav className="flex-1 overflow-y-auto p-3 space-y-1">
              <div className="text-[11px] font-semibold uppercase tracking-wider text-slate-400 px-3 py-1">필터</div>
              <SidebarItem active={currentFilter === 'today'} onClick={() => { setCurrentFilter('today'); setIsMobileSidebarOpen(false); }} icon={<Icons.Calendar className="w-4 h-4 text-blue-500" />} label="오늘 할 일" count={counts.todayCount} />
              <SidebarItem active={currentFilter === 'important'} onClick={() => { setCurrentFilter('important'); setIsMobileSidebarOpen(false); }} icon={<Icons.Star filled className="w-4 h-4 text-amber-500" />} label="중요한 일" count={counts.importantCount} />
              <SidebarItem active={currentFilter === 'upcoming'} onClick={() => { setCurrentFilter('upcoming'); setIsMobileSidebarOpen(false); }} icon={<Icons.Clock className="w-4 h-4 text-purple-500" />} label="예정된 일" count={counts.upcomingCount} />

                          handleUpdateTask({ ...selectedTask, subTasks: updated });

                          <Icons.X className="w-3.5 h-3.5" />
                        </button>

                        handleUpdateTask({ ...selectedTask, subTasks: [...(selectedTask.subTasks || []), newSub] });
                        e.target.value = '';
                      }
                    }} className="w-full text-xs bg-transparent border border-dashed border-slate-300 dark:border-slate-700 rounded-lg p-2 focus:outline-none" />

                              setCategories(categories.filter(c => c.id !== cat.id));
                              if (supabaseRef.current && isDbConnected) {
                                await supabaseRef.current.from('categories').delete().eq('id', cat.id);
                              }
                            }
                          }} className="text-slate-400 hover:text-rose-500 p-1">
                            <Icons.Trash className="w-4 h-4" />
                          </button>

                    const newCat = { id: 'cat_' + Date.now(), name, color };
                    setCategories([...categories, newCat]);

                      await supabaseRef.current.from('categories').insert([newCat]);

                    e.target.reset();

                          onChange={(e) => setSupabaseUrl(e.target.value)} 
                          placeholder="https://xxxxxxxx.supabase.co" 
                          className="w-full mt-1 bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-700 rounded-lg p-2 text-xs focus:outline-none"
                        />
                      </div>
                      <div>
                        <label className="text-slate-500 font-medium">Anon Public Key</label>
                        <input 
                          type="password" 
                          value={supabaseKey} 
                          onChange={(e) => setSupabaseKey(e.target.value)} 
                          placeholder="eyJhbGciOi..." 
                          className="w-full mt-1 bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-700 rounded-lg p-2 text-xs focus:outline-none"
                        />
                      </div>

                      <div className="flex space-x-2 pt-1">
                        <button 
                          onClick={() => {
                            localStorage.setItem('focusdo_sb_url', supabaseUrl.trim());
                            localStorage.setItem('focusdo_sb_key', supabaseKey.trim());
                            alert('Supabase 설정이 저장되었습니다. 데이터를 동기화합니다.');
                            window.location.reload();
                          }}
                          className="flex-1 py-2 bg-blue-600 hover:bg-blue-700 text-white rounded-lg text-xs font-semibold transition-colors"
                        >
                          저장 및 DB 연결
                        </button>
                        {isDbConnected && (
                          <button 
                            onClick={async () => {
                              if (confirm('현재 로컬스토리지의 할 일 목록을 Supabase DB로 모두 전송하시겠습니까?')) {
                                for (const t of tasks) {
                                  await supabaseRef.current.from('tasks').upsert({
                                    id: t.id,
                                    title: t.title,
                                    description: t.description,
                                    completed: t.completed,
                                    due_date: t.dueDate,
                                    priority: t.priority,
                                    starred: t.starred,
                                    category_id: t.categoryId,
                                    sub_tasks: t.subTasks,
                                    created_at: t.createdAt
                                  });
                                }
                                alert('로컬 데이터가 Supabase DB로 마이그레이션되었습니다!');
                              }
                            }}
                            className="px-3 py-2 border border-blue-300 dark:border-blue-700 text-blue-600 dark:text-blue-300 rounded-lg text-xs font-semibold"
                          >
                            로컬 ➡️ DB 업로드
                          </button>
                        )}
                      </div>
                    </div>
                  </div>

                  {/* 테마 설정 */}
                  <div>
                    <h4 className="text-xs font-semibold text-slate-400 uppercase tracking-wider mb-2">화면 모드</h4>
                    <div className="grid grid-cols-2 gap-2">
                      <button onClick={() => setDarkMode(false)} className={`p-3 rounded-xl border text-xs font-semibold flex items-center justify-center space-x-2 ${!darkMode ? 'border-blue-600 bg-blue-50/50 text-blue-600 dark:bg-blue-950/40' : 'border-slate-200 dark:border-slate-800'}`}>
                        <Icons.Sun className="w-4 h-4 text-amber-500" />
                        <span>라이트 모드</span>
                      </button>
                      <button onClick={() => setDarkMode(true)} className={`p-3 rounded-xl border text-xs font-semibold flex items-center justify-center space-x-2 ${darkMode ? 'border-blue-600 bg-blue-50/50 text-blue-600 dark:bg-blue-950/40' : 'border-slate-200 dark:border-slate-800'}`}>
                        <Icons.Moon className="w-4 h-4 text-blue-400" />
                        <span>다크 모드</span>
                      </button>
                    </div>
                  </div>

                  {/* 데이터 백업 & 복원 */}
                  <div>
                    <h4 className="text-xs font-semibold text-slate-400 uppercase tracking-wider mb-2">데이터 파일 백업</h4>
                    <button onClick={() => {
                      const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify({ tasks, categories }, null, 2));
                      const a = document.createElement('a');
                      a.href = dataStr;
                      a.download = `focusdo_backup_${getTodayStr()}.json`;
                      a.click();
                    }} className="w-full flex items-center justify-center space-x-2 p-2.5 rounded-xl border border-slate-200 dark:border-slate-800 hover:bg-slate-50 dark:hover:bg-slate-800 text-xs font-medium">
                      <Icons.Download className="w-4 h-4 text-blue-500" />
                      <span>할 일 데이터 백업 (JSON 다운로드)</span>
                    </button>
                  </div>
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    function SidebarItem({ active, onClick, icon, label, count }) {
      return (
        <button onClick={onClick} className={`w-full flex items-center justify-between px-3 py-2 rounded-xl text-xs md:text-sm font-medium transition-colors ${active ? 'bg-blue-50 dark:bg-blue-900/30 text-blue-600 dark:text-blue-400 font-semibold' : 'text-slate-600 dark:text-slate-400 hover:bg-slate-100 dark:hover:bg-slate-800/60'}`}>
          <div className="flex items-center space-x-2.5 truncate">{icon}<span className="truncate">{label}</span></div>
          {count > 0 && <span className={`text-[11px] px-1.5 py-0.5 rounded-md font-semibold ${active ? 'bg-blue-200/60 dark:bg-blue-800/60 text-blue-700 dark:text-blue-300' : 'bg-slate-100 dark:bg-slate-800 text-slate-500'}`}>{count}</span>}
        </button>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
