<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FocusDo - 스마트 할 일 관리 (To Do List)</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: {
              50: '#eff6ff',
              100: '#dbeafe',
              500: '#3b82f6',
              600: '#2563eb',
              700: '#1d4ed8',
            }
          }
        }
      }
    }
  </script>
  <!-- React & Babel CDN -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    /* Custom scrollbars */
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }

    ::-webkit-scrollbar-track {
      background: transparent;
    }

    ::-webkit-scrollbar-thumb {
      background: #cbd5e1;
      border-radius: 9999px;
    }

    .dark ::-webkit-scrollbar-thumb {
      background: #475569;
    }

    ::-webkit-scrollbar-thumb:hover {
      background: #94a3b8;
    }

    .dark ::-webkit-scrollbar-thumb:hover {
      background: #64748b;
    }
  </style>
</head>

<body
  class="bg-slate-50 dark:bg-slate-950 text-slate-900 dark:text-slate-100 min-h-screen transition-colors duration-200">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useMemo, useRef } = React;

    // --- 아이콘 컴포넌트 (외부 라이브러리 없이 100% 독립 렌더링) ---
    const Icons = {
      Check: ({ className = "w-5 h-5" }) => (
        <svg className={className} fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth={2}>
          <path strokeLinecap="round" strokeLinejoin="round" d="M5 13l4 4L19 7" />
        </svg>
      ),
      Plus: ({ className = "w-5 h-5" }) => (
        <svg className={className} fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth={2}>
          <path strokeLinecap="round" strokeLinejoin="round" d="M12 4v16m8-8H4" />
        </svg>
      ),
      Trash: ({ className = "w-5 h-5" }) => (
        <svg className={className} fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth={2}>
          <path strokeLinecap="round" strokeLinejoin="round" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" />
        </svg>
      ),
      Star: ({ filled = false, className = "w-5 h-5" }) => (
        <svg className={`${className} ${filled ? "fill-amber-400 text-amber-400" : "fill-none text-slate-400 hover:text-amber-400"}`} viewBox="0 0 24 24" stroke="currentColor" strokeWidth={2}>
          <path strokeLinecap="round" strokeLinejoin="round" d="M11.049 2.927c.3-.921 1.603-.921 1.902 0l1.519 4.674a1 1 0 00.95.69h4.915c.969 0 1.371 1.24.588 1.81l-3.976 2.888a1 1 0 00-.363 1.118l1.518 4.674c.3.922-.755 1.688-1.538 1.118l-3.976-2.888a1 1 0 00-1.176 0l-3.976 2.888c-.783.57-1.838-.197-1.538-1.118l1.518-4.674a1 1 0 00-.363-1.118l-3.976-2.888c-.784-.57-.38-1.81.588-1.81h4.914a1 1 0 00.951-.69l1.519-4.674z" />
        </svg>
      ),
      Calendar: ({ className = "w-4 h-4" }) => (
        <svg className={className} fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth={2}>
          <path strokeLinecap="round" strokeLinejoin="round" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z" />
        </svg>
      ),
      Sun: ({ className = "w-5 h-5" }) => (
        <svg className={className} fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth={2}>
          <path strokeLinecap="round" strokeLinejoin="round" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z" />
        </svg>
      ),
      Moon: ({ className = "w-5 h-5" }) => (
        <svg className={className} fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth={2}>
          <path strokeLinecap="round" strokeLinejoin="round" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z" />
        </svg>
      ),
      Settings: ({ className = "w-5 h-5" }) => (
        <svg className={className} fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth={2}>
          <path strokeLinecap="round" strokeLinejoin="round" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z" />
          <path strokeLinecap="round" strokeLinejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
        </svg>
      ),
      Search: ({ className = "w-5 h-5" }) => (
        <svg className={className} fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth={2}>
          <path strokeLinecap="round" strokeLinejoin="round" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />
        </svg>
      ),
      X: ({ className = "w-5 h-5" }) => (
        <svg className={className} fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth={2}>
          <path strokeLinecap="round" strokeLinejoin="round" d="M6 18L18 6M6 6l12 12" />
        </svg>
      ),
      Folder: ({ className = "w-4 h-4" }) => (
        <svg className={className} fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth={2}>
          <path strokeLinecap="round" strokeLinejoin="round" d="M3 7v10a2 2 0 002 2h14a2 2 0 002-2V9a2 2 0 00-2-2h-6l-2-2H5a2 2 0 00-2 2z" />
        </svg>
      ),
      Clock: ({ className = "w-4 h-4" }) => (
        <svg className={className} fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth={2}>
          <path strokeLinecap="round" strokeLinejoin="round" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z" />
        </svg>
      ),
      Download: ({ className = "w-5 h-5" }) => (
        <svg className={className} fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth={2}>
          <path strokeLinecap="round" strokeLinejoin="round" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4" />
        </svg>
      ),
      Upload: ({ className = "w-5 h-5" }) => (
        <svg className={className} fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth={2}>
          <path strokeLinecap="round" strokeLinejoin="round" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l-4-4m0 0L8 8m4-4v12" />
        </svg>
      ),
      Menu: ({ className = "w-6 h-6" }) => (
        <svg className={className} fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth={2}>
          <path strokeLinecap="round" strokeLinejoin="round" d="M4 6h16M4 12h16M4 18h16" />
        </svg>
      ),
      Tag: ({ className = "w-4 h-4" }) => (
        <svg className={className} fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth={2}>
          <path strokeLinecap="round" strokeLinejoin="round" d="M7 7h.01M7 3h5c.512 0 1.024.195 1.414.586l7 7a2 2 0 010 2.828l-7 7a2 2 0 01-2.828 0l-7-7A2 2 0 013 12V7a4 4 0 014-4z" />
        </svg>
      )
    };

    // --- 기본 초기 데이터 ---
    const DEFAULT_CATEGORIES = [
      { id: 'work', name: '업무', color: '#3b82f6' },
      { id: 'personal', name: '개인', color: '#10b981' },
      { id: 'study', name: '공부', color: '#8b5cf6' },
      { id: 'shopping', name: '쇼핑', color: '#f59e0b' },
    ];

    const getTodayStr = () => {
      const now = new Date();
      return now.toISOString().split('T')[0];
    };

    const DEFAULT_TASKS = [
      {
        id: '1',
        title: 'FocusDo 기능 살펴보기 (PRD 반영 확인)',
        description: 'PRD에 정의된 4개 화면과 핵심 기능들이 어떻게 구성되었는지 확인해 보세요.',
        completed: true,
        dueDate: getTodayStr(),
        priority: 'high',
        starred: true,
        categoryId: 'work',
        subTasks: [
          { id: 's1', title: '메인 대시보드 둘러보기', completed: true },
          { id: 's2', title: '상세 드로어 열어보기', completed: true },
        ],
        createdAt: new Date().toISOString()
      },
      {
        id: '2',
        title: '오늘 꼭 끝내야 하는 중요 태스크 추가해보기',
        description: '상단의 빠른 추가 입력창에서 제목과 마감일을 선택하고 Enter를 눌러보세요.',
        completed: false,
        dueDate: getTodayStr(),
        priority: 'high',
        starred: true,
        categoryId: 'work',
        subTasks: [
          { id: 's3', title: '우선순위를 높음(High)으로 설정하기', completed: false }
        ],
        createdAt: new Date().toISOString()
      },
      {
        id: '3',
        title: '우측 상단 톱니바퀴에서 다크 모드 켜보기',
        description: '다크 모드로 눈의 피로를 덜고 심플한 디자인을 즐겨보세요.',
        completed: false,
        dueDate: '',
        priority: 'medium',
        starred: false,
        categoryId: 'personal',
        subTasks: [],
        createdAt: new Date().toISOString()
      }
    ];

    // --- 메인 App 컴포넌트 ---
    function App() {
      // 1. 상태 관리 및 로컬스토리지 동기화
      const [tasks, setTasks] = useState(() => {
        try {
          const saved = localStorage.getItem('focusdo_tasks');
          return saved ? JSON.parse(saved) : DEFAULT_TASKS;
        } catch {
          return DEFAULT_TASKS;
        }
      });

      const [categories, setCategories] = useState(() => {
        try {
          const saved = localStorage.getItem('focusdo_categories');
          return saved ? JSON.parse(saved) : DEFAULT_CATEGORIES;
        } catch {
          return DEFAULT_CATEGORIES;
        }
      });

      const [darkMode, setDarkMode] = useState(() => {
        const saved = localStorage.getItem('focusdo_dark');
        return saved === 'true';
      });

      // 2. 뷰 필터 및 선택 상태
      const [currentFilter, setCurrentFilter] = useState('today'); // 'today', 'important', 'upcoming', 'all', 'completed', or categoryId
      const [selectedTaskId, setSelectedTaskId] = useState(null); // 화면 2 (상세 드로어)
      const [showCategoryModal, setShowCategoryModal] = useState(false); // 화면 3 (카테고리 관리)
      const [showSettingsModal, setShowSettingsModal] = useState(false); // 화면 4 (환경설정)
      const [searchQuery, setSearchQuery] = useState('');
      const [sortBy, setSortBy] = useState('created'); // 'created', 'due', 'priority'
      const [isMobileSidebarOpen, setIsMobileSidebarOpen] = useState(false);

      // 3. 신규 할 일 인풋 상태
      const [newTitle, setNewTitle] = useState('');
      const [newDueDate, setNewDueDate] = useState('');
      const [newPriority, setNewPriority] = useState('medium');
      const [newCategory, setNewCategory] = useState('work');

      // 로컬스토리지 저장 이펙트
      useEffect(() => {
        localStorage.setItem('focusdo_tasks', JSON.stringify(tasks));
      }, [tasks]);

      useEffect(() => {
        localStorage.setItem('focusdo_categories', JSON.stringify(categories));
      }, [categories]);

      useEffect(() => {
        localStorage.setItem('focusdo_dark', darkMode);
        if (darkMode) {
          document.documentElement.classList.add('dark');
        } else {
          document.documentElement.classList.remove('dark');
        }
      }, [darkMode]);

      // --- 핸들러 함수들 ---
      const handleAddTask = (e) => {
        if (e) e.preventDefault();
        if (!newTitle.trim()) return;

        const newTask = {
          id: Date.now().toString(),
          title: newTitle.trim(),
          description: '',
          completed: false,
          dueDate: newDueDate || (currentFilter === 'today' ? getTodayStr() : ''),
          priority: newPriority,
          starred: currentFilter === 'important',
          categoryId: categories.some(c => c.id === currentFilter) ? currentFilter : newCategory,
          subTasks: [],
          createdAt: new Date().toISOString()
        };

        setTasks([newTask, ...tasks]);
        setNewTitle('');
        setNewDueDate('');
      };

      const handleToggleComplete = (id) => {
        setTasks(tasks.map(t => t.id === id ? { ...t, completed: !t.completed, updatedAt: new Date().toISOString() } : t));
      };

      const handleToggleStar = (id) => {
        setTasks(tasks.map(t => t.id === id ? { ...t, starred: !t.starred } : t));
      };

      const handleDeleteTask = (id) => {
        setTasks(tasks.filter(t => t.id !== id));
        if (selectedTaskId === id) setSelectedTaskId(null);
      };

      const handleUpdateTask = (updated) => {
        setTasks(tasks.map(t => t.id === updated.id ? { ...updated, updatedAt: new Date().toISOString() } : t));
      };

      const handleClearCompleted = () => {
        if (confirm('완료된 모든 할 일을 목록에서 삭제하시겠습니까?')) {
          setTasks(tasks.filter(t => !t.completed));
        }
      };

      // --- 통계 및 필터링 ---
      const todayStr = getTodayStr();

      const counts = useMemo(() => {
        const todayCount = tasks.filter(t => !t.completed && t.dueDate === todayStr).length;
        const importantCount = tasks.filter(t => !t.completed && t.starred).length;
        const upcomingCount = tasks.filter(t => !t.completed && t.dueDate && t.dueDate > todayStr).length;
        const allCount = tasks.filter(t => !t.completed).length;
        const completedCount = tasks.filter(t => t.completed).length;
        return { todayCount, importantCount, upcomingCount, allCount, completedCount };
      }, [tasks, todayStr]);

      const filteredTasks = useMemo(() => {
        let result = tasks.filter(task => {
          // 검색어 필터
          if (searchQuery.trim() && !task.title.toLowerCase().includes(searchQuery.toLowerCase())) {
            return false;
          }

          // 사이드바 필터
          if (currentFilter === 'today') {
            return task.dueDate === todayStr || (!task.completed && !task.dueDate);
          }
          if (currentFilter === 'important') {
            return task.starred;
          }
          if (currentFilter === 'upcoming') {
            return task.dueDate && task.dueDate > todayStr;
          }
          if (currentFilter === 'all') {
            return true;
          }
          if (currentFilter === 'completed') {
            return task.completed;
          }
          // 특정 카테고리 필터
          return task.categoryId === currentFilter;
        });

        // 정렬
        return result.sort((a, b) => {
          if (a.completed !== b.completed) return a.completed ? 1 : -1;
          if (sortBy === 'priority') {
            const pMap = { high: 1, medium: 2, low: 3 };
            return pMap[a.priority] - pMap[b.priority];
          }
          if (sortBy === 'due') {
            if (!a.dueDate) return 1;
            if (!b.dueDate) return -1;
            return a.dueDate.localeCompare(b.dueDate);
          }
          return new Date(b.createdAt).getTime() - new Date(a.createdAt).getTime();
        });
      }, [tasks, currentFilter, searchQuery, sortBy, todayStr]);

      const selectedTask = tasks.find(t => t.id === selectedTaskId);

      // 전체 달성률 계산
      const completionRate = tasks.length > 0
        ? Math.round((tasks.filter(t => t.completed).length / tasks.length) * 100)
        : 0;

      return (
        <div className="flex h-screen overflow-hidden">

          {/* ========================================================
              [화면 1 - 좌측] 네비게이션 사이드바
             ======================================================== */}
          {/* 모바일 배경 오버레이 */}
          {isMobileSidebarOpen && (
            <div
              className="fixed inset-0 bg-black/40 z-30 md:hidden"
              onClick={() => setIsMobileSidebarOpen(false)}
            />
          )}

          <aside className={`
            fixed md:static inset-y-0 left-0 z-40 w-64 bg-white dark:bg-slate-900 border-r border-slate-200 dark:border-slate-800 
            flex flex-col transform transition-transform duration-200 ease-in-out
            ${isMobileSidebarOpen ? 'translate-x-0' : '-translate-x-full md:translate-x-0'}
          `}>
            {/* 앱 로고 헤더 */}
            <div className="p-4 border-b border-slate-200 dark:border-slate-800 flex items-center justify-between">
              <div className="flex items-center space-x-2.5">
                <div className="w-8 h-8 rounded-lg bg-blue-600 flex items-center justify-center text-white font-bold shadow-md shadow-blue-500/30">
                  <Icons.Check className="w-5 h-5 stroke-[2.5]" />
                </div>
                <div>
                  <h1 className="font-bold text-lg tracking-tight text-slate-800 dark:text-white leading-tight">FocusDo</h1>
                  <p className="text-[11px] text-slate-500 font-medium">스마트 할 일 관리</p>
                </div>
              </div>
              <button
                onClick={() => setDarkMode(!darkMode)}
                className="p-2 rounded-lg text-slate-500 hover:bg-slate-100 dark:hover:bg-slate-800 transition-colors"
                title={darkMode ? "라이트 모드로 전환" : "다크 모드로 전환"}
              >
                {darkMode ? <Icons.Sun className="w-4 h-4 text-amber-400" /> : <Icons.Moon className="w-4 h-4 text-slate-600" />}
              </button>
            </div>

            {/* 네비게이션 메뉴 */}
            <nav className="flex-1 overflow-y-auto p-3 space-y-1">
              <div className="text-[11px] font-semibold uppercase tracking-wider text-slate-400 px-3 py-1">필터</div>

              <SidebarItem
                active={currentFilter === 'today'}
                onClick={() => { setCurrentFilter('today'); setIsMobileSidebarOpen(false); }}
                icon={<Icons.Calendar className="w-4 h-4 text-blue-500" />}
                label="오늘 할 일"
                count={counts.todayCount}
              />
              <SidebarItem
                active={currentFilter === 'important'}
                onClick={() => { setCurrentFilter('important'); setIsMobileSidebarOpen(false); }}
                icon={<Icons.Star filled className="w-4 h-4 text-amber-500" />}
                label="중요한 일"
                count={counts.importantCount}
              />
              <SidebarItem
                active={currentFilter === 'upcoming'}
                onClick={() => { setCurrentFilter('upcoming'); setIsMobileSidebarOpen(false); }}
                icon={<Icons.Clock className="w-4 h-4 text-purple-500" />}
                label="예정된 일"
                count={counts.upcomingCount}
              />
              <SidebarItem
                active={currentFilter === 'all'}
                onClick={() => { setCurrentFilter('all'); setIsMobileSidebarOpen(false); }}
                icon={<Icons.Folder className="w-4 h-4 text-slate-500" />}
                label="전체 목록"
                count={counts.allCount}
              />
              <SidebarItem
                active={currentFilter === 'completed'}
                onClick={() => { setCurrentFilter('completed'); setIsMobileSidebarOpen(false); }}
                icon={<Icons.Check className="w-4 h-4 text-emerald-500" />}
                label="완료된 항목"
                count={counts.completedCount}
              />

              {/* 카테고리 섹션 */}
              <div className="pt-4 pb-1 flex items-center justify-between px-3">
                <span className="text-[11px] font-semibold uppercase tracking-wider text-slate-400">카테고리</span>
                <button
                  onClick={() => setShowCategoryModal(true)}
                  className="text-xs text-blue-500 hover:text-blue-600 hover:underline font-medium"
                >
                  관리
                </button>
              </div>

              {categories.map(cat => {
                const count = tasks.filter(t => !t.completed && t.categoryId === cat.id).length;
                return (
                  <SidebarItem
                    key={cat.id}
                    active={currentFilter === cat.id}
                    onClick={() => { setCurrentFilter(cat.id); setIsMobileSidebarOpen(false); }}
                    icon={<span className="w-2.5 h-2.5 rounded-full" style={{ backgroundColor: cat.color }} />}
                    label={cat.name}
                    count={count}
                  />
                );
              })}
            </nav>

            {/* 하단 진행률 및 설정 버튼 */}
            <div className="p-3 border-t border-slate-200 dark:border-slate-800 space-y-3">
              <div className="bg-slate-50 dark:bg-slate-800/60 p-3 rounded-xl border border-slate-100 dark:border-slate-800">
                <div className="flex justify-between items-center text-xs font-medium text-slate-600 dark:text-slate-300 mb-1.5">
                  <span>전체 달성률</span>
                  <span className="text-blue-600 dark:text-blue-400 font-bold">{completionRate}%</span>
                </div>
                <div className="w-full bg-slate-200 dark:bg-slate-700 h-2 rounded-full overflow-hidden">
                  <div
                    className="bg-blue-600 h-full rounded-full transition-all duration-300"
                    style={{ width: `${completionRate}%` }}
                  />
                </div>
              </div>

              <button
                onClick={() => setShowSettingsModal(true)}

                    <Icons.Calendar className="w-3.5 h-3.5 text-slate-400" />
                    <input

                      value={newPriority}
                      onChange={(e) => setNewPriority(e.target.value)}

                    >
                      <option value="high">🔴 높음</option>
                      <option value="medium">🟡 보통</option>
                      <option value="low">🔵 낮음</option>
                    </select>
                  </div>

                  {/* 카테고리 */}
                  <div className="flex items-center space-x-1 bg-slate-100 dark:bg-slate-800 px-2.5 py-1 rounded-lg">
                    <span className="text-slate-400">카테고리:</span>
                    <select
                      value={newCategory}
                      onChange={(e) => setNewCategory(e.target.value)}

                    >
                      {categories.map(c => (
                        <option key={c.id} value={c.id}>{c.name}</option>
                      ))}
                    </select>
                  </div>
                </div>
              </form>

              {/* 태스크 목록 (Task List) */}

                      <Icons.Check className="w-6 h-6" />
                    </div>
                    <p className="text-slate-600 dark:text-slate-400 font-medium text-sm">표시할 할 일이 없습니다.</p>
                    <p className="text-xs text-slate-400 mt-1">새로운 할 일을 추가하거나 다른 필터를 선택해 보세요.</p>
                  </div>
                ) : (
                  filteredTasks.map(task => {
                    const category = categories.find(c => c.id === task.categoryId);
                    const isSelected = selectedTaskId === task.id;
                    const subTasksCompleted = task.subTasks?.filter(s => s.completed).length || 0;
                    const subTasksTotal = task.subTasks?.length || 0;

                    return (
                      <div
                        key={task.id}
                        className={`
                          group flex items-center justify-between p-3.5 rounded-xl border transition-all duration-150 cursor-pointer
                          ${task.completed ? 'bg-slate-100/60 dark:bg-slate-900/40 border-transparent opacity-70' : 'bg-white dark:bg-slate-900 border-slate-200 dark:border-slate-800 shadow-sm hover:border-blue-300 dark:hover:border-blue-700'}
                          ${isSelected ? 'ring-2 ring-blue-500 border-transparent' : ''}
                        `}
                        onClick={() => setSelectedTaskId(task.id)}
                      >
                        {/* 체크박스 & 제목 */}
                        <div className="flex items-center space-x-3 min-w-0 flex-1 mr-3">
                          <button
                            type="button"
                            onClick={(e) => { e.stopPropagation(); handleToggleComplete(task.id); }}
                            className={`
                              w-5 h-5 rounded-full flex items-center justify-center transition-colors flex-shrink-0
                              ${task.completed
                                ? 'bg-emerald-500 text-white'
                                : 'border-2 border-slate-300 dark:border-slate-600 hover:border-emerald-500'}
                            `}
                          >
                            {task.completed && <Icons.Check className="w-3.5 h-3.5 stroke-[3]" />}
                          </button>

                          <div className="min-w-0 flex-1">

                                  style={{ backgroundColor: `${category.color}15`, color: category.color }}

                                  {category.name}
                                </span>
                              )}

                              {task.dueDate && (
                                <span className={`inline-flex items-center space-x-1 ${task.dueDate < todayStr && !task.completed

                                      : 'text-slate-400'

                                  <Icons.Calendar className="w-3 h-3" />
                                  <span>{task.dueDate === todayStr ? '오늘 마감' : task.dueDate}</span>
                                </span>

                                <span className="text-slate-400 inline-flex items-center space-x-0.5">
                                  <span>하위 {subTasksCompleted}/{subTasksTotal}</span>

                                <span className="text-[10px] bg-rose-50 dark:bg-rose-950/60 text-rose-500 px-1.5 py-0.2 rounded font-medium">높음</span>

                            onClick={() => handleToggleStar(task.id)}
                            className="p-1.5 rounded-lg hover:bg-slate-100 dark:hover:bg-slate-800 text-slate-400 transition-colors"

                            <Icons.Star filled={task.starred} className="w-4 h-4" />
                          </button>
                          <button
                            onClick={() => handleDeleteTask(task.id)}
                            className="p-1.5 rounded-lg hover:bg-rose-50 dark:hover:bg-rose-950/50 text-slate-400 hover:text-rose-500 transition-colors opacity-0 group-hover:opacity-100"
                            title="삭제"
                          >
                            <Icons.Trash className="w-4 h-4" />
                          </button>
                        </div>
                      </div>
                    );
                  })
                )}
              </div>
            </div>
          </main>

          {/* ========================================================
              [화면 2] 태스크 상세/편집 드로어 (Detail Drawer)
             ======================================================== */}

            <div className="fixed inset-y-0 right-0 z-50 w-full sm:w-96 bg-white dark:bg-slate-900 border-l border-slate-200 dark:border-slate-800 shadow-2xl flex flex-col transform transition-transform duration-200">

                <div className="flex items-center space-x-1">
                  <button
                    onClick={() => handleDeleteTask(selectedTask.id)}
                    className="p-1.5 text-slate-400 hover:text-rose-500 rounded-lg hover:bg-rose-50 dark:hover:bg-rose-950/40"
                    title="태스크 삭제"
                  >
                    <Icons.Trash className="w-4 h-4" />
                  </button>
                  <button
                    onClick={() => setSelectedTaskId(null)}
                    className="p-1.5 text-slate-400 hover:text-slate-600 dark:hover:text-slate-200 rounded-lg hover:bg-slate-100 dark:hover:bg-slate-800"
                  >
                    <Icons.X className="w-5 h-5" />
                  </button>
                </div>
              </div>

                  <button
                    onClick={() => handleToggleComplete(selectedTask.id)}
                    className={`
                      w-6 h-6 mt-1 rounded-full flex items-center justify-center transition-colors flex-shrink-0
                      ${selectedTask.completed
                        ? 'bg-emerald-500 text-white'
                        : 'border-2 border-slate-300 dark:border-slate-600 hover:border-emerald-500'}
                    `}
                  >
                    {selectedTask.completed && <Icons.Check className="w-4 h-4 stroke-[3]" />}
                  </button>
                  <textarea
                    value={selectedTask.title}
                    onChange={(e) => handleUpdateTask({ ...selectedTask, title: e.target.value })}
                    rows={2}
                    className="flex-1 bg-transparent border-none focus:outline-none text-base font-semibold text-slate-900 dark:text-white resize-none"
                    placeholder="제목을 입력하세요"
                  />
                </div>

                {/* 마감일 & 우선순위 & 카테고리 설정 */}

                  <div className="flex items-center justify-between">
                    <span className="text-slate-500 dark:text-slate-400 font-medium">마감일</span>
                    <input
                      type="date"
                      value={selectedTask.dueDate || ''}
                      onChange={(e) => handleUpdateTask({ ...selectedTask, dueDate: e.target.value })}
                      className="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-700 rounded-lg px-2 py-1 text-slate-700 dark:text-slate-300 focus:outline-none"
                    />
                  </div>

                  <div className="flex items-center justify-between">
                    <span className="text-slate-500 dark:text-slate-400 font-medium">우선순위</span>
                    <select
                      value={selectedTask.priority}
                      onChange={(e) => handleUpdateTask({ ...selectedTask, priority: e.target.value })}
                      className="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-700 rounded-lg px-2 py-1 text-slate-700 dark:text-slate-300 focus:outline-none"
                    >
                      <option value="high">🔴 높음 (High)</option>
                      <option value="medium">🟡 보통 (Medium)</option>
                      <option value="low">🔵 낮음 (Low)</option>
                    </select>
                  </div>

                  <div className="flex items-center justify-between">
                    <span className="text-slate-500 dark:text-slate-400 font-medium">카테고리</span>
                    <select
                      value={selectedTask.categoryId}
                      onChange={(e) => handleUpdateTask({ ...selectedTask, categoryId: e.target.value })}
                      className="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-700 rounded-lg px-2 py-1 text-slate-700 dark:text-slate-300 focus:outline-none"
                    >
                      {categories.map(c => (
                        <option key={c.id} value={c.id}>{c.name}</option>
                      ))}
                    </select>
                  </div>
                </div>

                {/* 메모 및 설명 */}
                <div className="space-y-1.5">
                  <label className="text-xs font-semibold text-slate-500 dark:text-slate-400 uppercase tracking-wider">메모 / 설명</label>
                  <textarea
                    value={selectedTask.description || ''}
                    onChange={(e) => handleUpdateTask({ ...selectedTask, description: e.target.value })}
                    rows={4}
                    placeholder="세부 내용이나 링크, 참고 사항을 적어두세요..."
                    className="w-full text-xs md:text-sm bg-slate-50 dark:bg-slate-800/50 border border-slate-200 dark:border-slate-800 rounded-xl p-3 text-slate-800 dark:text-slate-200 placeholder-slate-400 focus:outline-none focus:ring-1 focus:ring-blue-500"
                  />
                </div>

                {/* 하위 작업 (Sub-tasks) */}
                <div className="space-y-2">
                  <div className="flex items-center justify-between">
                    <label className="text-xs font-semibold text-slate-500 dark:text-slate-400 uppercase tracking-wider">하위 작업 (체크리스트)</label>
                    <span className="text-xs text-slate-400">
                      {selectedTask.subTasks?.filter(s => s.completed).length || 0} / {selectedTask.subTasks?.length || 0}
                    </span>
                  </div>

                  <div className="space-y-1.5">
                    {selectedTask.subTasks?.map(st => (
                      <div key={st.id} className="flex items-center space-x-2 bg-slate-50 dark:bg-slate-800/40 p-2 rounded-lg text-xs">
                        <input
                          type="checkbox"
                          checked={st.completed}
                          onChange={() => {
                            const updated = selectedTask.subTasks.map(s => s.id === st.id ? { ...s, completed: !s.completed } : s);
                            handleUpdateTask({ ...selectedTask, subTasks: updated });
                          }}
                          className="rounded text-blue-600 cursor-pointer"
                        />
                        <span className={`flex-1 ${st.completed ? 'line-through text-slate-400' : 'text-slate-700 dark:text-slate-200'}`}>
                          {st.title}
                        </span>
                        <button
                          onClick={() => {
                            const updated = selectedTask.subTasks.filter(s => s.id !== st.id);
                            handleUpdateTask({ ...selectedTask, subTasks: updated });
                          }}
                          className="text-slate-400 hover:text-rose-500"
                        >
                          <Icons.X className="w-3.5 h-3.5" />
                        </button>
                      </div>
                    ))}

                    {/* 새 하위 작업 추가 인풋 */}
                    <input
                      type="text"
                      placeholder="+ 하위 작업 추가 후 Enter..."
                      onKeyDown={(e) => {
                        if (e.key === 'Enter' && e.target.value.trim()) {
                          const newSub = { id: Date.now().toString(), title: e.target.value.trim(), completed: false };
                          handleUpdateTask({ ...selectedTask, subTasks: [...(selectedTask.subTasks || []), newSub] });
                          e.target.value = '';
                        }
                      }}
                      className="w-full text-xs bg-transparent border border-dashed border-slate-300 dark:border-slate-700 rounded-lg p-2 focus:outline-none focus:border-blue-500 text-slate-700 dark:text-slate-300"
                    />
                  </div>
                </div>
              </div>

              {/* 드로어 하단 메타정보 */}
              <div className="p-4 border-t border-slate-200 dark:border-slate-800 text-[11px] text-slate-400 flex justify-between">
                <span>생성: {new Date(selectedTask.createdAt).toLocaleDateString()}</span>
                {selectedTask.updatedAt && (
                  <span>수정: {new Date(selectedTask.updatedAt).toLocaleTimeString()}</span>
                )}
              </div>
            </div>
          )}

          {/* ========================================================
              [화면 3] 카테고리 관리 모달 (Category Modal)
             ======================================================== */}
          {showCategoryModal && (
            <div className="fixed inset-0 z-50 bg-black/50 backdrop-blur-sm flex items-center justify-center p-4">
              <div className="bg-white dark:bg-slate-900 w-full max-w-md rounded-2xl shadow-xl border border-slate-200 dark:border-slate-800 overflow-hidden">
                <div className="p-4 border-b border-slate-200 dark:border-slate-800 flex justify-between items-center">
                  <h3 className="font-bold text-slate-800 dark:text-white">카테고리 관리</h3>
                  <button onClick={() => setShowCategoryModal(false)} className="text-slate-400 hover:text-slate-600">
                    <Icons.X className="w-5 h-5" />
                  </button>
                </div>

                <div className="p-4 space-y-4">
                  {/* 카테고리 목록 */}
                  <div className="space-y-2 max-h-60 overflow-y-auto">
                    {categories.map(cat => (
                      <div key={cat.id} className="flex items-center justify-between p-2.5 bg-slate-50 dark:bg-slate-800 rounded-xl">
                        <div className="flex items-center space-x-2.5">
                          <span className="w-3.5 h-3.5 rounded-full" style={{ backgroundColor: cat.color }} />
                          <span className="text-sm font-medium text-slate-700 dark:text-slate-200">{cat.name}</span>
                        </div>
                        {categories.length > 1 && (
                          <button
                            onClick={() => {
                              if (confirm(`'${cat.name}' 카테고리를 삭제하시겠습니까?`)) {
                                setCategories(categories.filter(c => c.id !== cat.id));
                              }
                            }}
                            className="text-slate-400 hover:text-rose-500 p-1"
                          >
                            <Icons.Trash className="w-4 h-4" />
                          </button>
                        )}
                      </div>
                    ))}
                  </div>

                  {/* 새 카테고리 추가 폼 */}
                  <form
                    onSubmit={(e) => {
                      e.preventDefault();
                      const name = e.target.elements.catName.value.trim();
                      const color = e.target.elements.catColor.value;
                      if (!name) return;
                      const newCat = { id: 'cat_' + Date.now(), name, color };
                      setCategories([...categories, newCat]);
                      e.target.reset();
                    }}
                    className="pt-3 border-t border-slate-200 dark:border-slate-800 flex items-center space-x-2"
                  >
                    <input
                      type="color"
                      name="catColor"
                      defaultValue="#3b82f6"
                      className="w-8 h-8 rounded cursor-pointer border-0 bg-transparent"
                    />
                    <input
                      type="text"
                      name="catName"
                      placeholder="새 카테고리 이름..."
                      className="flex-1 text-xs md:text-sm bg-slate-100 dark:bg-slate-800 px-3 py-2 rounded-xl border-none focus:outline-none"
                    />
                    <button
                      type="submit"
                      className="px-3 py-2 bg-blue-600 hover:bg-blue-700 text-white rounded-xl text-xs font-semibold"
                    >
                      추가
                    </button>
                  </form>
                </div>
              </div>
            </div>
          )}

          {/* ========================================================
              [화면 4] 환경설정 및 백업 모달 (Settings View)
             ======================================================== */}
          {showSettingsModal && (
            <div className="fixed inset-0 z-50 bg-black/50 backdrop-blur-sm flex items-center justify-center p-4">
              <div className="bg-white dark:bg-slate-900 w-full max-w-md rounded-2xl shadow-xl border border-slate-200 dark:border-slate-800 overflow-hidden">
                <div className="p-4 border-b border-slate-200 dark:border-slate-800 flex justify-between items-center">
                  <h3 className="font-bold text-slate-800 dark:text-white">환경설정</h3>
                  <button onClick={() => setShowSettingsModal(false)} className="text-slate-400 hover:text-slate-600">
                    <Icons.X className="w-5 h-5" />
                  </button>
                </div>

                <div className="p-5 space-y-6">
                  {/* 테마 설정 */}
                  <div>
                    <h4 className="text-xs font-semibold text-slate-400 uppercase tracking-wider mb-2">화면 모드</h4>
                    <div className="grid grid-cols-2 gap-2">
                      <button
                        onClick={() => setDarkMode(false)}
                        className={`p-3 rounded-xl border text-xs font-semibold flex items-center justify-center space-x-2 ${!darkMode ? 'border-blue-600 bg-blue-50/50 text-blue-600 dark:bg-blue-950/40' : 'border-slate-200 dark:border-slate-800'}`}
                      >
                        <Icons.Sun className="w-4 h-4 text-amber-500" />
                        <span>라이트 모드</span>
                      </button>
                      <button
                        onClick={() => setDarkMode(true)}
                        className={`p-3 rounded-xl border text-xs font-semibold flex items-center justify-center space-x-2 ${darkMode ? 'border-blue-600 bg-blue-50/50 text-blue-600 dark:bg-blue-950/40' : 'border-slate-200 dark:border-slate-800'}`}
                      >
                        <Icons.Moon className="w-4 h-4 text-blue-400" />
                        <span>다크 모드</span>
                      </button>
                    </div>
                  </div>

                  {/* 데이터 백업 & 복원 */}
                  <div>
                    <h4 className="text-xs font-semibold text-slate-400 uppercase tracking-wider mb-2">데이터 백업 및 복원</h4>
                    <div className="space-y-2">
                      <button
                        onClick={() => {
                          const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify({ tasks, categories }, null, 2));
                          const downloadAnchor = document.createElement('a');
                          downloadAnchor.setAttribute("href", dataStr);
                          downloadAnchor.setAttribute("download", `focusdo_backup_${getTodayStr()}.json`);
                          document.body.appendChild(downloadAnchor);
                          downloadAnchor.click();
                          downloadAnchor.remove();
                        }}
                        className="w-full flex items-center justify-center space-x-2 p-2.5 rounded-xl border border-slate-200 dark:border-slate-800 hover:bg-slate-50 dark:hover:bg-slate-800 text-xs font-medium text-slate-700 dark:text-slate-300"
                      >
                        <Icons.Download className="w-4 h-4 text-blue-500" />
                        <span>할 일 데이터 백업 (JSON 다운로드)</span>
                      </button>

                      <label className="w-full flex items-center justify-center space-x-2 p-2.5 rounded-xl border border-slate-200 dark:border-slate-800 hover:bg-slate-50 dark:hover:bg-slate-800 text-xs font-medium text-slate-700 dark:text-slate-300 cursor-pointer">
                        <Icons.Upload className="w-4 h-4 text-emerald-500" />
                        <span>백업 파일 복원 (JSON 업로드)</span>
                        <input
                          type="file"
                          accept=".json"
                          className="hidden"
                          onChange={(e) => {
                            const file = e.target.files[0];
                            if (!file) return;
                            const reader = new FileReader();
                            reader.onload = (event) => {
                              try {
                                const parsed = JSON.parse(event.target.result);
                                if (parsed.tasks && Array.isArray(parsed.tasks)) {
                                  setTasks(parsed.tasks);
                                  if (parsed.categories) setCategories(parsed.categories);
                                  alert('성공적으로 데이터를 복원했습니다!');
                                  setShowSettingsModal(false);
                                } else {
                                  alert('유효하지 않은 백업 파일 형식입니다.');
                                }
                              } catch (err) {
                                alert('파일을 읽는 중 오류가 발생했습니다.');
                              }
                            };
                            reader.readAsText(file);
                          }}
                        />
                      </label>
                    </div>
                  </div>

                  {/* 데이터 초기화 */}
                  <div className="pt-2 border-t border-slate-200 dark:border-slate-800">
                    <button
                      onClick={() => {
                        if (confirm('모든 할 일 데이터와 카테고리를 초기화하시겠습니까? 이 작업은 되돌릴 수 없습니다.')) {
                          localStorage.clear();
                          setTasks(DEFAULT_TASKS);
                          setCategories(DEFAULT_CATEGORIES);
                          alert('기본 데이터로 초기화되었습니다.');
                          setShowSettingsModal(false);
                        }
                      }}
                      className="w-full p-2.5 rounded-xl text-rose-500 hover:bg-rose-50 dark:hover:bg-rose-950/40 text-xs font-semibold"
                    >
                      모든 데이터 초기화
                    </button>
                  </div>
                </div>
              </div>
            </div>
          )}

        </div>
      );
    }

    // --- 사이드바 아이템 컴포넌트 ---
    function SidebarItem({ active, onClick, icon, label, count }) {
      return (
        <button
          onClick={onClick}
          className={`
            w-full flex items-center justify-between px-3 py-2 rounded-xl text-xs md:text-sm font-medium transition-colors
            ${active
              ? 'bg-blue-50 dark:bg-blue-900/30 text-blue-600 dark:text-blue-400 font-semibold'
              : 'text-slate-600 dark:text-slate-400 hover:bg-slate-100 dark:hover:bg-slate-800/60'}
          `}
        >
          <div className="flex items-center space-x-2.5 truncate">
            {icon}
            <span className="truncate">{label}</span>
          </div>
          {count > 0 && (
            <span className={`text-[11px] px-1.5 py-0.5 rounded-md font-semibold ${active ? 'bg-blue-200/60 dark:bg-blue-800/60 text-blue-700 dark:text-blue-300' : 'bg-slate-100 dark:bg-slate-800 text-slate-500'}`}>
              {count}
            </span>
          )}
        </button>
      );
    }

    // 렌더링 시작
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>

</html>
